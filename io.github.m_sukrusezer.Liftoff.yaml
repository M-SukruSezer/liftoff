# Liftoff — Flatpak manifesti
#
# Yerel deneme:
#   flatpak-builder --user --install --force-clean build io.github.m_sukrusezer.Liftoff.yaml
#   flatpak run io.github.m_sukrusezer.Liftoff
#
# Kaynak, deponun v1.0.0 etiketidir; Flathub yerel dizinden derlemeyi
# kabul etmez. Yeni sürüm yayınlarken "tag" ve "commit" değerlerini
# birlikte güncelleyin.

id: io.github.m_sukrusezer.Liftoff
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: liftoff

finish-args:
  # --- pencere ve çizim ---
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # --- kullanıcının autostart girdileri (okuma + yazma) ---
  # Oturum yöneticisi yalnızca gerçek ~/.config/autostart dizinini okur,
  # uygulamanın özel yapılandırma dizinini değil.
  - --filesystem=xdg-config/autostart:create

  # --- sistem geneli autostart girdileri, salt okunur ---
  # Bu izin olmadan uygulama /etc/xdg/autostart içindeki 17 girdi yerine
  # yalnızca runtime'ın kendi 2 girdisini görür (ölçülmüştür).
  - --filesystem=host-etc:ro

  # --- systemctl ve pkexec host üzerinde çalıştırılır ---
  # GNOME runtime'ı systemd içermez; bu izin olmadan "Kullanıcı servisleri"
  # ve "Sistem servisleri" sekmelerinin ikisi de hiç çalışmaz.
  # GENİŞ BİR İZİNDİR: host'ta komut çalıştırmaya olanak tanır.
  # README'deki "Flathub incelemesi" bölümüne bakın.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: liftoff
    buildsystem: simple
    build-commands:
      - install -Dm755 build-aux/liftoff-launcher /app/bin/liftoff
      - mkdir -p /app/share/liftoff
      - cp -r liftoff /app/share/liftoff/liftoff
      - install -Dm644 data/io.github.m_sukrusezer.Liftoff.desktop /app/share/applications/io.github.m_sukrusezer.Liftoff.desktop
      - install -Dm644 data/io.github.m_sukrusezer.Liftoff.metainfo.xml /app/share/metainfo/io.github.m_sukrusezer.Liftoff.metainfo.xml
      - install -Dm644 data/io.github.m_sukrusezer.Liftoff.svg /app/share/icons/hicolor/scalable/apps/io.github.m_sukrusezer.Liftoff.svg
      - install -Dm644 data/io.github.m_sukrusezer.Liftoff-symbolic.svg /app/share/icons/hicolor/symbolic/apps/io.github.m_sukrusezer.Liftoff-symbolic.svg
    sources:
      - type: git
        url: https://github.com/M-SukruSezer/liftoff.git
        tag: v1.0.0
        # Etiketin işaret ettiği commit (imzalı etiket nesnesinin değil).
        commit: 1eef3f241d579fb1c67922d529f617d4e1a4f263
      # Yerel denemek için yukarıdaki bloğu yorumlayıp bunu açın:
      # - type: dir
      #   path: .
      #   skip:
      #     - .git
      #     - build
      #     - .flatpak-builder
